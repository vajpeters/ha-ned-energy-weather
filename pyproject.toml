[tool.pytest.ini_options]
asyncio_mode = "auto"
# Home Assistant must install its HTTPX alias before plugins import HTTPX.
addopts = "-p no:respx"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
